<div class="leave-form-container">
  <h2>{{ isEditMode ? 'Modifier la demande de congé' : 'Nouvelle demande de congé' }}</h2>

  <form [formGroup]="LeaveForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-group">
      <label for="startDate">Date de début</label>
      <input type="date" id="startDate" formControlName="startDate" class="form-control" />
      <div *ngIf="LeaveForm.get('startDate')?.invalid && LeaveForm.get('startDate')?.touched" class="error">
        La date de début est requise.
      </div>
    </div>

    <div class="form-group">
      <label for="endDate">Date de fin</label>
      <input type="date" id="endDate" formControlName="endDate" class="form-control" />
      <div *ngIf="LeaveForm.get('endDate')?.invalid && LeaveForm.get('endDate')?.touched" class="error">
        La date de fin est requise.
      </div>
    </div>

    <div class="form-group">
      <label for="reason">Motif</label>
      <textarea id="reason" formControlName="reason" class="form-control" rows="3"></textarea>
      <div *ngIf="LeaveForm.get('reason')?.invalid && LeaveForm.get('reason')?.touched" class="error">
        Le motif est requis.
      </div>
    </div>
      <div class="form-group">
        <label for="status">Status</label>
          <select id="status" formControlName="status" class="form-control">
            <option value="APPROVED">APPROVED</option>
            <option value="PENDING">PENDING</option>
            <option value="REJECTED">REJECTED</option>
          </select>  
          <div *ngIf="LeaveForm.get('status')?.invalid && LeaveForm.get('status')?.touched" class="error">
            Le status est requis.
          </div>
      </div>

      


    <div *ngIf="error" class="error-message">
      {{ error }}
    </div>

    <button type="submit" class="submit-button" [disabled]="isLoading || LeaveForm.invalid">
      {{ isEditMode ? 'Mettre à jour' : 'Envoyer la demande' }}
    </button>
  </form>
</div>
