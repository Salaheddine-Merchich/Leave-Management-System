<section class="employees-container">
  <div class="user-header">
    <h2 class="section-title">👤 Informations de l'utilisateur</h2>
  </div>

  <div class="user-details-card" *ngIf="user">
    <div class="user-avatar">
      <img src="https://ui-avatars.com/api/?name={{ user.name }}" alt="Avatar de {{ user.name }}">
    </div>

    <div class="user-info">
      <h3 class="user-name">{{ user.name }}</h3>
      <p class="user-email">📧 {{ user.email }}</p>
      <p class="user-role">🔐 Rôle : <span>{{ user.role }}</span></p>
    </div>
  </div>
</section>
