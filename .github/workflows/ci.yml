name: LMS CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-quality:
    name: Frontend Linter, Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run build --if-present

      - name: Run Unit Tests (Headless)
        run: npm test -- --watch=false --browsers=ChromeHeadless

  backend-quality:
    name: Backend Build & Unit/Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Maven Tests (Excluding E2E)
        run: ./mvnw test -Dtest="!*E2ETest,!*TestSuite"

  e2e-tests:
    name: End-to-End Selenium Tests
    needs: [frontend-quality, backend-quality]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: Start Backend Server
        working-directory: ./backend
        run: |
          chmod +x mvnw
          ./mvnw spring-boot:run &
        env:
          spring_profiles_active: test

      - name: Start Frontend Server
        working-directory: ./frontend
        run: npx ng serve --host 127.0.0.1 --port 4200 > frontend.log 2>&1 &
        env:
          NG_CLI_ANALYTICS: "false"

      - name: Wait for Servers to be Ready
        run: |
          echo "Waiting for backend on port 8080..."
          timeout 120 bash -c 'while ! nc -z 127.0.0.1 8080; do sleep 1; done' || { echo "Backend timeout"; exit 1; }
          echo "Backend is up!"
          
          echo "Waiting for frontend on port 4200..."
          timeout 120 bash -c 'while ! nc -z 127.0.0.1 4200; do sleep 1; done' || { echo "Frontend timeout. Logs:"; cat ./frontend/frontend.log; exit 1; }
          echo "Frontend is up!"

      - name: Run Selenium E2E Tests
        working-directory: ./backend
        run: ./mvnw test -Dtest="*E2ETest" -DbaseUrl="http://127.0.0.1:4200"
        
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Selenium E2E Results
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit
